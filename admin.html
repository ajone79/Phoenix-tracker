<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="/manifest.json">

<link rel="apple-touch-icon" href="/icon-eu168.png">

<style>
  :root{--void:#050507;--panel:#111116;--panel-2:#17171e;--hair:#2a2a34;--signal:#ff9142;--periwinkle:#8fa3ff;--mint:#5fd068;--gold:#ffc857;--alert:#ff5a5f;--text:#e8e6e1;--text-dim:#8a8a94;--text-faint:#55555f;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--void);color:var(--text);font-family:'Space Mono',monospace;}
  .topbar{display:flex;align-items:stretch;height:60px;}
  .elbow{width:110px;background:var(--signal);border-bottom-left-radius:30px;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;}
  .elbow span{font-family:'Antonio',sans-serif;font-weight:700;color:var(--void);font-size:12px;letter-spacing:.08em;}
  .topbar-bar{flex:1;background:var(--panel);display:flex;align-items:center;padding:0 22px;border-bottom:2px solid var(--hair);}
  .topbar-title{font-family:'Antonio',sans-serif;font-weight:700;font-size:20px;letter-spacing:.05em;}
  .topbar-title b{color:var(--signal);}
  .phx-nav{
    position:sticky; top:0; z-index:9999;
    display:flex; align-items:center; gap:4px;
    background:#0a0a0d; border-bottom:2px solid #f2a93b;
    padding:0 14px; height:36px;
    font-family:ui-monospace,'SF Mono','Consolas',monospace;
    overflow-x:auto; white-space:nowrap;
  }
  .phx-nav .phx-nav-tag{
    color:#f2a93b; font-weight:700; letter-spacing:.12em; font-size:11px;
    margin-right:12px; flex-shrink:0;
  }
  .phx-nav a{
    color:#9a9aa4; text-decoration:none; font-size:11px; letter-spacing:.06em;
    text-transform:uppercase; padding:8px 12px; border-radius:0 0 6px 6px;
    transition:color .15s ease, background .15s ease; flex-shrink:0;
  }
  .phx-nav a:hover{ color:#e8e6e1; background:rgba(255,255,255,.06); }
  .phx-nav a.current{ color:#0a0a0d; background:#f2a93b; font-weight:700; }
  main{padding:26px 30px 60px;max-width:980px;margin:0 auto;}
  h2{font-family:'Antonio',sans-serif;font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dim);margin:28px 0 12px;}
  .row{background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .row.pending{border-color:var(--gold);}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--panel-2);flex-shrink:0;object-fit:cover;}
  .who{min-width:160px;}
  .dname{font-weight:700;font-size:13px;}
  .did{font-size:9.5px;color:var(--text-faint);}
  input[type=text]{background:var(--panel-2);border:1px solid var(--hair);color:var(--text);font-family:'Space Mono',monospace;font-size:12px;padding:7px 10px;border-radius:6px;flex:1;min-width:160px;}
  .btn{font-family:'Antonio',sans-serif;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:11px;padding:8px 14px;border-radius:6px;border:none;cursor:pointer;}
  .btn.approve{background:var(--mint);color:var(--void);}
  .btn.revoke{background:transparent;border:1px solid var(--alert);color:var(--alert);}
  .btn.save{background:var(--periwinkle);color:var(--void);}
  .btn.admin{background:transparent;border:1px solid var(--gold);color:var(--gold);}
  .tag{font-size:9px;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;}
  .tag.approved{background:rgba(95,208,104,.15);color:var(--mint);}
  .tag.pending{background:rgba(255,200,87,.15);color:var(--gold);}
  .tag.admintag{background:rgba(255,200,87,.2);color:var(--gold);border:1px solid var(--gold);}
  .allowlist-banner{background:rgba(255,200,87,.08);border:1px solid var(--gold);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:11.5px;}
  .allowlist-banner b{color:var(--gold);}
  .allow-chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--hair);border-radius:20px;padding:3px 10px 3px 10px;margin:4px 6px 0 0;font-size:11px;}
  .allow-chip.matched{border-color:var(--mint);color:var(--mint);}
  .allow-chip.waiting{color:var(--text-faint);}
  .empty{color:var(--text-faint);font-size:12px;padding:20px 0;}
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .gate-box{max-width:400px;text-align:center;padding:30px;}
  .import-box{background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:18px 20px;margin-bottom:10px;}
  .import-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .field-group{display:flex;flex-direction:column;gap:3px;}
  .field-label{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
  select, input[type=file]{background:var(--panel-2);border:1px solid var(--hair);color:var(--text);font-family:'Space Mono',monospace;font-size:12px;padding:7px 10px;border-radius:6px;}
  .btn.extract{background:var(--signal);color:var(--void);}
  .btn.save-all{background:var(--mint);color:var(--void);}
  .btn.force{background:transparent;border:1px solid var(--alert);color:var(--alert);padding:4px 10px;font-size:9.5px;}
  .review-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11.5px;}
  .review-table th{text-align:left;color:var(--text-faint);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--hair);}
  .review-table td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;}
  .review-table tr.flagged{background:rgba(255,90,95,.07);}
  .review-table tr.nomatch{background:rgba(255,200,87,.07);}
  .review-table tr.fuzzymatch{background:rgba(143,163,255,.06);}
  .review-table input[type=text], .review-table input[type=number]{width:100%;min-width:80px;}
  .review-table select{width:100%;min-width:150px;}
  .flag-note{font-size:9.5px;color:var(--alert);margin-top:2px;}
  .fuzzy-note{font-size:9.5px;color:var(--periwinkle);margin-top:2px;}
  .import-status{font-size:11px;color:var(--text-dim);margin-top:8px;}
  .import-status.err{color:var(--alert);}
  .import-status.ok{color:var(--mint);}
  .stitch-gallery{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
  .stitch-thumb{position:relative;width:130px;border:1px solid var(--hair);border-radius:8px;overflow:hidden;background:var(--panel-2);}
  .stitch-thumb img{width:100%;display:block;max-height:220px;object-fit:cover;object-position:top;}
  .stitch-thumb .lbl{font-size:9px;color:var(--text-faint);padding:3px 6px;}
  .stitch-thumb .rm{position:absolute;top:4px;right:4px;background:rgba(10,10,13,.85);border:1px solid var(--alert);color:var(--alert);width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:11px;line-height:1;}
</style>
</head>
<body>
<div id="app"><div class="gate"><div class="gate-box">Loading…</div></div></div>

<script>
const SUPABASE_URL = 'https://mmzizgsanwqjpiumpqay.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1teml6Z3NhbndxanBpdW1wcWF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjk5MzksImV4cCI6MjEwMTYwNTkzOX0.KqvY2Ib33J8h8ztEi8qxtfutSdVIPAaJRtj7cSUSKFM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let profiles = [];
let roster = [];
let allowlist = [];
let events = [];
let arcs = [];
let me = null;
let mySession = null;

let extractedRows = []; // {name, score, playerId, existingScore}
let extractStatus = { loading: false, message: '', kind: '' };
let guideOpen = false;
let thresholdsOpen = false;
let stitchedPreviews = []; // {id, dataUrl, sourceCount}
let screensPerStitch = 5;
let selectedEventId = '';
let batchStatuses = []; // {label, state, message}  -- legacy, no longer used for sending but kept harmless
let pendingDeleteEventId = null;
let activeJob = null;
let jobPollTimer = null;

function eventThresholdRowHtml(e){
  const isPendingDelete = pendingDeleteEventId === e.id;
  return `
    <tr data-eventrow="${e.id}">
      <td>${escapeHtml(e.name)} <span style="color:var(--text-faint)">(${e.date})</span></td>
      <td>
        <select data-scoringtypeinput="${e.id}">
          <option value="score" ${e.scoring_type==='score'?'selected':''}>Score-based</option>
          <option value="tasks" ${e.scoring_type==='tasks'?'selected':''}>Task count</option>
        </select>
      </td>
      <td>
        <select data-completionmodeinput="${e.id}">
          <option value="average" ${(!e.completion_mode || e.completion_mode==='average')?'selected':''}>Average / percentile</option>
          <option value="threshold" ${e.completion_mode==='threshold'?'selected':''}>Threshold (pass/fail)</option>
        </select>
      </td>
      <td><input type="number" data-thresholdinput="${e.id}" value="${e.threshold ?? ''}"></td>
      <td><button class="btn save" data-savethreshold="${e.id}">Save</button></td>
      <td>${isPendingDelete
        ? `<button class="btn force" data-confirmdelete="${e.id}" style="background:var(--alert);color:var(--void);">⚠ Confirm delete?</button> <button class="btn admin" data-canceldelete="${e.id}">Cancel</button>`
        : `<button class="btn force" data-deleteevent="${e.id}">Delete</button>`}
      </td>
    </tr>
  `;
}

function rerenderThresholdsTable(){
  document.querySelector('#eventThresholdsTable tbody').innerHTML = events.map(e => eventThresholdRowHtml(e)).join('');
  wireThresholdsTable();
}

function wireThresholdsTable(){
  document.querySelectorAll('[data-savethreshold]').forEach(b => b.addEventListener('click', async () => {
    const eventId = b.dataset.savethreshold;
    const thresholdInput = document.querySelector(`[data-thresholdinput="${eventId}"]`);
    const scoringTypeInput = document.querySelector(`[data-scoringtypeinput="${eventId}"]`);
    const completionModeInput = document.querySelector(`[data-completionmodeinput="${eventId}"]`);
    const val = thresholdInput.value === '' ? null : parseInt(thresholdInput.value);
    const { error } = await sb.from('events').update({
      threshold: val,
      scoring_type: scoringTypeInput.value,
      completion_mode: completionModeInput.value,
      updated_at: new Date().toISOString()
    }).eq('id', eventId);
    if (error) { alert(`Error saving: ${error.message}`); return; }
    const ev = events.find(e => e.id === eventId);
    if (ev) { ev.threshold = val; ev.scoring_type = scoringTypeInput.value; ev.completion_mode = completionModeInput.value; }
    b.textContent = 'Saved ✓';
    setTimeout(() => { b.textContent = 'Save'; }, 1500);
  }));
  document.querySelectorAll('[data-deleteevent]').forEach(b => b.addEventListener('click', () => {
    pendingDeleteEventId = b.dataset.deleteevent;
    rerenderThresholdsTable();
  }));
  document.querySelectorAll('[data-canceldelete]').forEach(b => b.addEventListener('click', () => {
    pendingDeleteEventId = null;
    rerenderThresholdsTable();
  }));
  document.querySelectorAll('[data-confirmdelete]').forEach(b => b.addEventListener('click', async () => {
    const eventId = b.dataset.confirmdelete;
    b.textContent = 'Deleting…';
    b.disabled = true;
    const { error } = await sb.from('events').delete().eq('id', eventId);
    if (error) { alert(`Delete failed: ${error.message}`); pendingDeleteEventId = null; rerenderThresholdsTable(); return; }
    events = events.filter(e => e.id !== eventId);
    if (selectedEventId === eventId) selectedEventId = '';
    pendingDeleteEventId = null;
    rerenderThresholdsTable();
    refreshImportSectionOnly();
  }));
}

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = 'login.html?next=admin.html'; return; }
  mySession = session;

  let { data: myProfile } = await sb.from('tracker_profiles').select('*').eq('id', session.user.id).maybeSingle();
  if (!myProfile || !myProfile.is_admin) {
    document.getElementById('app').innerHTML = `<div class="gate"><div class="gate-box"><h2 style="color:#ff5a5f">Not authorized</h2><p style="color:#8a8a94;font-size:12px;">This page is for alliance admins only.</p><a href="index.html" style="color:#ff9142;">← Back to tracker</a></div></div>`;
    return;
  }
  me = myProfile;
  await loadData();
  await checkForActiveJob();
  render();
}

async function loadData(){
  const [{data:p}, {data:r}, {data:a}, {data:e}, {data:ar}] = await Promise.all([
    sb.from('tracker_profiles').select('*').order('approved', {ascending:true}).order('created_at', {ascending:false}),
    sb.from('roster').select('id,name,level').order('name'),
    sb.from('tracker_admin_allowlist').select('*').order('in_game_name'),
    sb.from('events').select('id,name,date,arc_id,scoring_type,completion_mode,threshold,is_test').order('date', {ascending:false}),
    sb.from('arcs').select('id,name,status').order('end_date', {ascending:false})
  ]);
  profiles = p || [];
  roster = r || [];
  allowlist = a || [];
  events = e || [];
  arcs = ar || [];
}

function render(){
  const pending = profiles.filter(p=>!p.approved);
  const approved = profiles.filter(p=>p.approved);

  const allowChips = allowlist.map(a => {
    const match = profiles.find(p => (p.in_game_name||'').trim().toLowerCase() === a.in_game_name.trim().toLowerCase());
    if (match && match.is_admin) return `<span class="allow-chip matched">✓ ${escapeHtml(a.in_game_name)} — admin</span>`;
    if (match) return `<span class="allow-chip matched">${escapeHtml(a.in_game_name)} — linked, not admin yet <button class="btn admin" style="padding:2px 8px;font-size:9px;" data-admintoggle="${match.id}" data-current="false">Make admin</button></span>`;
    return `<span class="allow-chip waiting">${escapeHtml(a.in_game_name)} — hasn't logged in yet</span>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <nav class="phx-nav"><span class="phx-nav-tag">PHX</span><a href="index.html">🏠 Home</a><a href="admin.html" class="current">🛠️ Admin</a></nav>
    <div class="topbar">
      <div class="elbow"><span>PHX</span></div>
      <div class="topbar-bar"><div class="topbar-title"><b>PHOENIX</b> EU168 — ACCESS ADMIN</div></div>
    </div>
    <main>
      <p style="font-size:11.5px;color:#8a8a94;">Signed in as <b>${escapeHtml(me.discord_username)}</b>. Approve pending Discord logins below and, since Discord names rarely match in-game names, type the correct in-game name next to each person yourself — matching this list against the roster.</p>

      <button class="btn admin" id="guideToggle" style="margin-bottom:10px;">📖 How to use this page ${guideOpen ? '(hide)' : '(show)'}</button>
      <div id="guideBox" style="${guideOpen ? '' : 'display:none;'}background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:16px 20px;margin-bottom:18px;font-size:11.5px;color:var(--text-dim);line-height:1.7;">
        <b style="color:var(--signal);">Approving new members</b><br>
        When someone signs in with Discord for the first time, they show up under "Pending approval" with just a Discord name. Type their real in-game name into the box next to their row (check it against the roster if unsure), then hit <b>Approve</b>. They don't need to log in again — access takes effect immediately.<br><br>

        <b style="color:var(--signal);">Making someone an admin</b><br>
        The "Intended admins" banner lists who's supposed to get admin rights. Once one of them has logged in and you've filled in their in-game name, a "Make admin" button appears next to their name in that banner — click it. You can also promote/demote anyone from the Approved members list using the Admin / Remove admin buttons.<br><br>

        <b style="color:var(--signal);">Creating a new event</b><br>
        Click <b>+ New event</b> next to the event dropdown in the import panel. Fill in a name and date, pick whether it's scored by points or task-count, and choose the completion mode:
        <ul style="margin:6px 0 6px 18px;padding:0;">
          <li><b>Average / percentile</b> — players are ranked and colour-coded against each other (gold/green/amber/pink/red tiers).</li>
          <li><b>Threshold (pass/fail)</b> — there's a single score/task-count line; hitting it is green, below is red or amber.</li>
        </ul>
        Set the <b>Threshold</b> field if it's a threshold-mode event, or if you want a specific pass line for the tracker's colour coding. You can also edit — or delete — an event later in the "Manage event thresholds" table (click to expand it). Deleting an event asks for a second confirmation click before it actually happens, and automatically removes any scores logged against it too.<br><br>

        <b style="color:var(--signal);">Importing scores from a screenshot</b><br>
        1. Pick the event, then choose your screenshots of the in-game leaderboard — any number at once.<br>
        2. Set <b>"Screens per stitched image"</b> if you want (defaults to 5 — the most Groq can reliably read in one go). Click <b>Preview stitched image(s)</b>. This builds the combined images entirely in your browser first — nothing is sent anywhere yet. You'll see a thumbnail per batch ("Batch 1", "Batch 2"...); remove any that look bad with the ✕, or change the screens-per-image number and preview again.<br>
        3. When it looks right, click <b>Send to Groq</b>. Each batch is sent as its own separate request, one at a time, with a status line showing exactly what's happening ("Sending in 42s…", "Sending to Groq…", "Done — 14 rows"). This is deliberately paced (~65 seconds between batches) because Groq's free tier resets its usage allowance once a minute, and a single stitched image can already use most of that allowance — going faster just causes rate-limit errors. If a batch gets rate-limited it retries automatically using Groq's own suggested wait time.<br>
        4. <b>If any batch fails even after retrying, nothing is added to the review table</b> — this is intentional, so you never end up with an incomplete set of scores without realising it. The stitched previews are kept so you can just press Send again to retry everything, without rebuilding from scratch.<br>
        5. The same player often shows up twice in one screenshot (their own row usually stays pinned on screen regardless of scroll position) — these duplicates are automatically detected and removed, both by Groq itself and again as a backup check on this page.<br>
        6. <b>Always check the review table before saving.</b> Every extracted name is matched against the roster automatically: an exact or clearly-contained match needs no attention, but a <span style="color:var(--periwinkle)">blue-tinted row with an "⚠ auto-matched — please verify" note</span> means the name didn't match exactly and the closest-sounding roster name was picked automatically — double check these, they're usually right but worth a glance. An amber row with an empty dropdown means no match was found at all and needs picking manually. Scores are editable if anything looks misread.<br>
        7. Rows highlighted <span style="color:var(--alert)">red</span> have a new score lower than what's already stored for that player — these are excluded from the bulk save on purpose (protects against accidentally overwriting a correct score with a bad screenshot read). If the new value is genuinely correct, use that row's <b>Save anyway</b> button.<br>
        8. <b>Save all checked (non-flagged)</b> writes everything else straight into the scores table. <b>Clear all rows</b> resets the review table when you're starting fresh on a new event.
      </div>

      <div class="allowlist-banner"><b>Intended admins:</b><br>${allowChips}</div>

      <h2>Pending approval (${pending.length})</h2>
      <div id="pendingList">${pending.length ? pending.map(rowHtml).join('') : '<div class="empty">Nobody waiting.</div>'}</div>

      <h2>Import scores from screenshot</h2>
      <div id="importBoxWrap">${importSectionHtml()}</div>

      <button class="btn admin" id="thresholdsToggle" style="margin:18px 0 4px;">Manage event thresholds ${thresholdsOpen ? '▲ (hide)' : '▼ (show)'}</button>
      <div id="thresholdsBox" style="${thresholdsOpen ? '' : 'display:none;'}">
        <div class="import-box">
          <table class="review-table" id="eventThresholdsTable">
            <thead><tr><th>Event</th><th>Scoring Type</th><th>Completion Mode</th><th>Threshold</th><th></th><th></th></tr></thead>
            <tbody>
              ${events.map(e => eventThresholdRowHtml(e)).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <h2>Approved members (${approved.length})</h2>
      <div id="approvedList">${approved.length ? approved.map(rowHtml).join('') : '<div class="empty">No approved members yet.</div>'}</div>
    </main>
  `;

  document.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click', ()=>setApproved(b.dataset.approve, true)));
  document.querySelectorAll('[data-revoke]').forEach(b=>b.addEventListener('click', ()=>setApproved(b.dataset.revoke, false)));
  document.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click', ()=>saveName(b.dataset.save)));
  document.querySelectorAll('[data-admintoggle]').forEach(b=>b.addEventListener('click', ()=>toggleAdmin(b.dataset.admintoggle, b.dataset.current==='true')));

  wireImportSection();

  const guideToggle = document.getElementById('guideToggle');
  if (guideToggle) guideToggle.addEventListener('click', () => {
    guideOpen = !guideOpen;
    const box = document.getElementById('guideBox');
    box.style.display = guideOpen ? '' : 'none';
    guideToggle.textContent = `📖 How to use this page ${guideOpen ? '(hide)' : '(show)'}`;
  });

  const thresholdsToggle = document.getElementById('thresholdsToggle');
  if (thresholdsToggle) thresholdsToggle.addEventListener('click', () => {
    thresholdsOpen = !thresholdsOpen;
    const box = document.getElementById('thresholdsBox');
    box.style.display = thresholdsOpen ? '' : 'none';
    thresholdsToggle.textContent = `Manage event thresholds ${thresholdsOpen ? '▲ (hide)' : '▼ (show)'}`;
  });

  wireThresholdsTable();

  if (window.__phxInitNavMenu) window.__phxInitNavMenu();
}

function rowHtml(p){
  if (p.is_owner) {
    return `
      <div class="row">
        ${p.avatar_url ? `<img class="avatar" src="${escapeHtml(p.avatar_url)}">` : '<div class="avatar"></div>'}
        <div class="who">
          <div class="dname">${escapeHtml(p.discord_username||'Unknown')}</div>
          <div class="did">${escapeHtml(p.discord_id||'')}</div>
        </div>
        <input type="text" placeholder="In-game name" value="${escapeHtml(p.in_game_name||'')}" data-nameinput="${p.id}">
        <button class="btn save" data-save="${p.id}">Save</button>
        <span class="tag approved">Approved</span>
        <span class="tag admintag" style="border-color:var(--gold);color:var(--gold);">👑 Owner — protected</span>
      </div>
    `;
  }
  return `

// ==================== Score import from screenshot ====================

function normalizeName(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({length: m+1}, () => new Array(n+1).fill(0));
  for (let i=0;i<=m;i++) dp[i][0]=i;
  for (let j=0;j<=n;j++) dp[0][j]=j;
  for (let i=1;i<=m;i++){
    for (let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

// Returns { playerId, confidence } where confidence is 'exact' | 'substring' | 'fuzzy' | null.
// With a roster this small (~90 distinct names), the nearest edit-distance match is almost
// always correct even for fairly mangled OCR reads -- so we always surface the closest
// candidate rather than giving up, but flag anything short of an exact match for a human check.
function bestRosterMatch(extractedName){
  const norm = normalizeName(extractedName);
  if (!norm) return { playerId: null, confidence: null };

  const exact = roster.find(r => normalizeName(r.name) === norm);
  if (exact) return { playerId: exact.id, confidence: 'exact' };

  const contains = roster.find(r => normalizeName(r.name).includes(norm) || norm.includes(normalizeName(r.name)));
  if (contains) return { playerId: contains.id, confidence: 'substring' };

  let best = null, bestDist = Infinity;
  for (const r of roster) {
    const rn = normalizeName(r.name);
    if (!rn) continue;
    const d = levenshtein(norm, rn);
    if (d < bestDist) { bestDist = d; best = r; }
  }
  if (best) return { playerId: best.id, confidence: 'fuzzy', distance: bestDist };
  return { playerId: null, confidence: null };
}

function activeJobHtml(){

  const rowsHtml = batches.map((b,i) => `

      <span style="width:70px;flex-shrink:0;color:var(--signal);font-weight:700;">Batch ${i+1}</span>
      <span style="color:${colorFor(b.status)};">${escapeHtml(b.message || b.status || 'queued')}</span>
    </div>
  `).join('');

  const eventName = escapeHtml((events.find(e=>e.id===activeJob.event_id)||{}).name || activeJob.event_id || '');
  let footer = '';
  if (activeJob.status === 'processing') {
    footer = `
      <div style="font-size:10px;color:var(--text-faint);margin-top:8px;">Running on the server — safe to close this tab, lock your phone, or come back later. Checks in every few seconds while this page is open.</div>

        <button class="btn admin" id="jobRefreshBtn">Check now</button>
        <button class="btn force" id="jobCancelBtn">Cancel job</button>
      </div>`;
  } else if (activeJob.status === 'done') {

    footer = `<div class="import-row" style="margin-top:10px;"><button class="btn save-all" id="jobLoadBtn">Load ${n} row(s) into review table</button></div>`;

async function checkForActiveJob(){
  const { data } = await sb.from('import_jobs')
    .select('*')
    .eq('created_by', mySession.user.id)
    .eq('dismissed', false)
    .order('created_at', { ascending: false })
    .limit(1)
    .maybeSingle();
  activeJob = data || null;
  if (activeJob && activeJob.status === 'processing') startJobPolling();
}

function startJobPolling(){
  stopJobPolling();
  jobPollTimer = setInterval(pollActiveJob, 6000);
}
function stopJobPolling(){
  if (jobPollTimer) { clearInterval(jobPollTimer); jobPollTimer = null; }
}

async function pollActiveJob(){
  if (!activeJob) { stopJobPolling(); return; }
  const { data } = await sb.from('import_jobs').select('*').eq('id', activeJob.id).maybeSingle();
  if (!data) { activeJob = null; stopJobPolling(); refreshImportSectionOnly(); return; }
  activeJob = data;
  if (activeJob.status !== 'processing') stopJobPolling();
  refreshImportSectionOnly();
}

async function handleLoadJobResults(){
  if (!activeJob || activeJob.status !== 'done') return;
  const eventId = activeJob.event_id;
  const { data: existing } = await sb.from('scores').select('player_id,score').eq('event_id', eventId);
  const existingMap = {};
  (existing||[]).forEach(s => existingMap[s.player_id] = s.score);

  const rows = activeJob.result_rows || [];
  extractedRows = extractedRows.concat(rows.map(r => {
    const match = bestRosterMatch(r.name);
    return {
      name: r.name,
      score: parseInt(r.score) || 0,
      playerId: match.playerId,
      matchConfidence: match.confidence,
      existingScore: match.playerId ? (existingMap[match.playerId] ?? null) : null,
      include: true,
      eventId
    };
  }));

  await sb.from('import_jobs').update({ dismissed: true }).eq('id', activeJob.id);
  selectedEventId = eventId;
  activeJob = null;
  setImportStatus(`Loaded ${rows.length} row(s) from the completed job — ${extractedRows.length} total in review.`, 'ok');
  refreshImportSectionOnly();
}

async function handleRetryJob(){
  if (!activeJob || activeJob.status !== 'error') return;
  const batches = [...(activeJob.batches || [])];
  const idx = activeJob.next_batch_index;
  if (batches[idx]) batches[idx] = { ...batches[idx], status: 'pending', message: 'Queued for retry', attempt: 0 };
  const { data, error } = await sb.from('import_jobs').update({
    status: 'processing', batches, next_attempt_at: new Date().toISOString(), error_message: null
  }).eq('id', activeJob.id).select().maybeSingle();
  if (error) { alert(`Retry failed: ${error.message}`); return; }
  activeJob = data;
  startJobPolling();
  refreshImportSectionOnly();
}

async function handleDiscardJob(){
  if (!activeJob) return;
  const wasProcessing = activeJob.status === 'processing';
  await sb.from('import_jobs').update({
    dismissed: true,
    status: wasProcessing ? 'error' : activeJob.status,
    error_message: wasProcessing ? 'Cancelled by admin' : activeJob.error_message
  }).eq('id', activeJob.id);
  stopJobPolling();
  activeJob = null;
  refreshImportSectionOnly();
}

function reviewTableHtml(){
  const rows = extractedRows.map((r, i) => {

    const noMatch = !r.playerId;

    const rowClass = isFlagged ? 'flagged' : (noMatch ? 'nomatch' : (isFuzzy ? 'fuzzymatch' : ''));
    return `
      <tr class="${rowClass}" data-row="${i}">
        <td><input type="checkbox" data-include="${i}" ${r.include ? 'checked' : ''}></td>
        <td>${escapeHtml(r.name)}</td>

          <select data-matchselect="${i}">
            <option value="">— no match, pick manually —</option>
            ${roster.map(p=>`<option value="${p.id}" ${p.id===r.playerId?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
          </select>
          ${isFuzzy ? `<div class="fuzzy-note">⚠ auto-matched (closest name) — please verify</div>` : ''}
        </td>
        <td><input type="number" data-scoreinput="${i}" value="${r.score}"></td>
        <td>
          ${r.existingScore != null ? `current: ${r.existingScore}` : '<span style="color:var(--text-faint)">no existing score</span>'}

        </td>
        <td>${isFlagged ? `<button class="btn force" data-forcesave="${i}">Save anyway</button>` : ''}</td>
      </tr>
    `;
  }).join('');

  return `
    <table class="review-table">
      <thead><tr><th>Use</th><th>Extracted name</th><th>Matched player</th><th>Score</th><th>Existing</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="import-row" style="margin-top:12px;">
      <button class="btn save-all" id="saveAllBtn">Save all checked (non-flagged)</button>
      <button class="btn force" id="clearRowsBtn">Clear all rows</button>
    </div>
  `;
}

async function handlePreviewStitch(){

    stitchedPreviews = await buildStitchedPreviews(files, screensPerStitch);
    setImportStatus(`${stitchedPreviews.length} batch(es) ready — check them below, then send to Groq.`, 'ok');

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function handleSendToGroq(){
  const eventId = document.getElementById('importEventSelect').value;
  if (!eventId) { setImportStatus('Pick an event first.', 'err'); return; }
  if (stitchedPreviews.length === 0) { setImportStatus('Nothing to send — build a preview first.', 'err'); return; }

  const batches = stitchedPreviews.map((p) => ({
    id: p.id, dataUrl: p.dataUrl, sourceCount: p.sourceCount,
    status: 'pending', message: `Queued (${p.sourceCount} screens)`, rows: null, attempt: 0
  }));

  setImportStatus('Starting background job…', '');
  const { data, error } = await sb.from('import_jobs').insert({
    event_id: eventId,
    created_by: mySession.user.id,
    status: 'processing',
    batches,
    next_batch_index: 0,
    next_attempt_at: new Date().toISOString(),
    pacing_seconds: 65
  }).select().maybeSingle();

  if (error) { setImportStatus(`Couldn't start job: ${error.message}`, 'err'); return; }

  activeJob = data;
  stitchedPreviews = [];
  setImportStatus('Job started — this now runs on the server (checked every minute) and keeps going even if you close this tab. Come back anytime to check progress.', 'ok');
  startJobPolling();
  refreshImportSectionOnly();
}

function slugifyEventId(name, date){
  const slug = String(name||'').toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);
  const dateSuffix = date ? date.replace(/-/g, '').slice(4) : ''; // MMDD
  return `ev_${slug}${dateSuffix ? '_' + dateSuffix : ''}`;
}

async function handleCreateEvent(){
  const name = document.getElementById('newEventName').value.trim();
  const date = document.getElementById('newEventDate').value;
  const arcId = document.getElementById('newEventArc').value;
  const isTest = document.getElementById('newEventIsTest').checked;
  const scoringType = document.getElementById('newEventScoringType').value;
  const completionMode = document.getElementById('newEventCompletionMode').value;
  const thresholdRaw = document.getElementById('newEventThreshold').value;
  const statusEl = document.getElementById('newEventStatus');

  if (!name || !date) { statusEl.textContent = 'Name and date are required.'; statusEl.style.color = 'var(--alert)'; return; }
  if (!scoringType || !completionMode) { statusEl.textContent = 'Please select both a scoring type and a completion mode.'; statusEl.style.color = 'var(--alert)'; return; }

  const id = slugifyEventId(name, date);
  const insertBody = {
    id, name, date, scoring_type: scoringType, completion_mode: completionMode,
    start_date: date, arc_id: arcId || null, is_test: isTest
  };
  if (thresholdRaw !== '') insertBody.threshold = parseInt(thresholdRaw);

  const { data, error } = await sb.from('events').insert(insertBody).select().maybeSingle();

  if (error) { statusEl.textContent = `Error: ${error.message}`; statusEl.style.color = 'var(--alert)'; return; }

  events = [data, ...events];

  statusEl.style.color = 'var(--mint)';

  sel.innerHTML = `<option value="">— pick an event to update existing scores —</option>` + events.map(e=>`<option value="${e.id}">${escapeHtml(e.name)} (${e.date})</option>`).join('');
  sel.value = id;
  selectedEventId = id;
  document.getElementById('newEventForm').style.display = 'none';
  document.getElementById('newEventName').value = '';
  document.getElementById('newEventThreshold').value = '';
}

function fileToDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function loadImageFromDataUrl(dataUrl){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = dataUrl;
  });
}

const STITCH_MAX_TOTAL_HEIGHT = 2200;

async function stitchGroupIntoImage(dataUrls){
  const imgs = await Promise.all(dataUrls.map(loadImageFromDataUrl));
  const width = Math.max(...imgs.map(im => im.naturalWidth));
  const scaledHeights = imgs.map(im => im.naturalHeight * (width / im.naturalWidth));
  const totalHeight = Math.round(scaledHeights.reduce((a,b) => a+b, 0));

  const shrink = totalHeight > STITCH_MAX_TOTAL_HEIGHT ? (STITCH_MAX_TOTAL_HEIGHT / totalHeight) : 1;
  const finalWidth = Math.round(width * shrink);
  const finalHeights = scaledHeights.map(h => Math.round(h * shrink));
  const finalTotalHeight = finalHeights.reduce((a,b) => a+b, 0);

  const canvas = document.createElement('canvas');
  canvas.width = finalWidth;
  canvas.height = finalTotalHeight;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let y = 0;
  imgs.forEach((im, i) => {
    ctx.drawImage(im, 0, y, finalWidth, finalHeights[i]);
    y += finalHeights[i];
  });

  return canvas.toDataURL('image/jpeg', 0.85);
}

// Groups files into fixed-size chunks (screensPerStitch each) and stitches each
// chunk into one tall image. Returns preview objects the admin can inspect and
// remove before anything is sent to Groq.
async function buildStitchedPreviews(files, perStitch){
  const dataUrls = await Promise.all(Array.from(files).map(fileToDataUrl));
  const groups = [];
  for (let i = 0; i < dataUrls.length; i += perStitch) {
    groups.push(dataUrls.slice(i, i + perStitch));
  }
  const previews = [];
  for (let i = 0; i < groups.length; i++) {
    const stitched = await stitchGroupIntoImage(groups[i]);
    previews.push({ id: `p${i}`, dataUrl: stitched, sourceCount: groups[i].length });
  }
  return previews;
}

async function handleSaveAll(){
  const eventId = document.getElementById('importEventSelect').value;
  const eligible = extractedRows.filter(r => r.include && r.playerId && !(r.existingScore != null && r.score < r.existingScore));
  // if the same player was extracted twice (e.g. across stitched batches), keep the last one
  const byPlayer = {};
  eligible.forEach(r => { byPlayer[r.playerId] = r; });
  const toSave = Object.values(byPlayer);
  if (toSave.length === 0) { setImportStatus('Nothing eligible to save — check matches and flags above.', 'err'); return; }

  const upserts = toSave.map(r => ({ event_id: eventId, player_id: r.playerId, score: r.score, updated_at: new Date().toISOString() }));
  const { error } = await sb.from('scores').upsert(upserts, { onConflict: 'event_id,player_id' });
  if (error) { setImportStatus(`Save failed: ${error.message}`, 'err'); return; }

  // Remove exactly the rows that were just saved -- leave behind anything skipped
  // (unchecked, flagged, unmatched) so it's still visible and doesn't get silently lost.
  const savedSet = new Set(toSave);
  extractedRows = extractedRows.filter(r => !savedSet.has(r));

  const eventName = (events.find(e => e.id === eventId) || {}).name || eventId;
  const skippedCount = extractedRows.length;
  refreshImportSectionOnly();
  showSaveSuccessBanner(toSave.length, eventName, skippedCount);
}

function showSaveSuccessBanner(count, eventName, skippedCount){
  const el = document.getElementById('saveSuccessBanner');
  if (!el) return;
  el.style.display = 'flex';
  el.innerHTML = `
    <span style="font-size:20px;">✅</span>
    <div>
      <div style="font-weight:700;color:var(--mint);">Saved ${count} score${count===1?'':'s'} to "${escapeHtml(eventName)}"</div>
      ${skippedCount ? `<div style="font-size:10.5px;color:var(--text-dim);margin-top:2px;">${skippedCount} row(s) still waiting below (unchecked, flagged, or unmatched) — nothing was lost.</div>` : `<div style="font-size:10.5px;color:var(--text-dim);margin-top:2px;">Review table is clear — ready for the next upload.</div>`}
    </div>
  `;
  clearTimeout(showSaveSuccessBanner._t);
  showSaveSuccessBanner._t = setTimeout(() => { el.style.display = 'none'; }, 8000);
}

function handleClearRows(){
  extractedRows = [];
  document.getElementById('reviewWrap').innerHTML = '';
  setImportStatus('Cleared.', '');
}

async function handleForceSave(idx){
  const r = extractedRows[idx];
  if (!r || !r.playerId) return;
  const { error } = await sb.from('scores').upsert(
    [{ event_id: r.eventId, player_id: r.playerId, score: r.score, updated_at: new Date().toISOString() }],
    { onConflict: 'event_id,player_id' }
  );
  if (error) { setImportStatus(`Save failed: ${error.message}`, 'err'); return; }
  r.existingScore = r.score;
  setImportStatus(`Saved ${r.name}'s score (overwrote a higher stored value).`, 'ok');
  refreshReviewTableOnly();
}

// ==================== end score import ====================

init();
</script>
