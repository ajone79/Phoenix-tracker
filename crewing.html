<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phoenix EU168 — Crewing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#050507; --panel:#111116; --panel-2:#17171e; --hair:#2a2a34;
    --signal:#ff9142; --periwinkle:#8fa3ff; --mint:#5fd068; --gold:#ffc857; --alert:#ff5a5f;
    --text:#e8e6e1; --text-dim:#8a8a94; --text-faint:#55555f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--void);color:var(--text);font-family:'Space Mono',monospace;-webkit-font-smoothing:antialiased;}
  #app{display:flex;min-height:100vh;flex-direction:column;}
  .topbar{display:flex;align-items:stretch;height:64px;flex-shrink:0;}
  .elbow{width:120px;background:var(--signal);border-bottom-left-radius:34px;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;}
  .elbow span{font-family:'Antonio',sans-serif;font-weight:700;color:var(--void);font-size:13px;letter-spacing:.08em;}
  .topbar-bar{flex:1;background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:2px solid var(--hair);}
  .topbar-title{font-family:'Antonio',sans-serif;font-weight:700;font-size:22px;letter-spacing:.06em;}
  .topbar-title b{color:var(--signal);}
  .topbar-sub{font-size:11px;color:var(--text-dim);}
  .body-row{display:flex;flex:1;min-height:0;}
  .sidebar{width:220px;flex-shrink:0;background:var(--panel);padding:22px 0;display:flex;flex-direction:column;gap:6px;border-right:2px solid var(--hair);overflow-y:auto;}
  .sidebar-label{margin:0 20px 8px;font-family:'Antonio',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);}
  .navbtn{margin:0 14px;padding:10px 16px;border-radius:0 20px 20px 0;font-family:'Antonio',sans-serif;font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:13px;cursor:pointer;border:none;text-align:left;background:transparent;color:var(--text-dim);transition:all .12s ease;}
  .navbtn:hover{color:var(--text);background:rgba(255,255,255,.05);}
  .navbtn.active{background:var(--signal);color:var(--void);}
  .sidebar-foot{margin-top:auto;padding:16px 20px 0;font-size:10px;color:var(--text-faint);line-height:1.6;border-top:1px solid var(--hair);}
  main{flex:1;padding:26px 30px 40px;overflow-y:auto;}
  .section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap;}
  .section-head h1{font-family:'Antonio',sans-serif;font-weight:700;font-size:26px;margin:0;letter-spacing:.03em;}
  .section-head .accent{color:var(--signal);}
  .section-desc{color:var(--text-dim);font-size:12px;max-width:680px;margin-bottom:20px;}
  .empty{color:var(--text-faint);font-size:12px;padding:30px 4px;text-align:center;}
  .loading{padding:40px;text-align:center;color:var(--text-dim);font-size:12px;}
  .crew-card{background:var(--panel);border:1px solid var(--hair);border-radius:10px;overflow:hidden;margin-bottom:22px;}
  .crew-card img{width:100%;display:block;cursor:zoom-in;background:#1c1c22;}
  .crew-card-meta{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .crew-card-title{font-family:'Antonio',sans-serif;font-weight:700;font-size:15px;}
  .crew-card-sub{font-size:11px;color:var(--text-dim);}
  .crew-card-tags{padding:0 16px 12px;display:flex;gap:6px;flex-wrap:wrap;}
  .tag{font-size:10px;background:var(--panel-2);border:1px solid var(--hair);color:var(--text-dim);padding:2px 8px;border-radius:20px;letter-spacing:.03em;}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:999;padding:24px;cursor:zoom-out;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--hair);border-radius:4px;}
  .errbox{background:#2a1414;border:1px solid var(--alert);color:#ffb3b6;padding:14px 16px;border-radius:8px;font-size:11.5px;margin-bottom:18px;white-space:pre-wrap;word-break:break-word;}

/* ===== PHX cross-page nav strip ===== */
.phx-nav{
  position:sticky; top:0; z-index:9999;
  display:flex; align-items:center; gap:4px;
  background:#0a0a0d; border-bottom:2px solid #f2a93b;
  padding:0 14px; height:36px;
  font-family:ui-monospace,'SF Mono','Consolas',monospace;
  overflow-x:auto; white-space:nowrap;
}
.phx-nav .phx-nav-tag{
  color:#f2a93b; font-weight:700; letter-spacing:.12em; font-size:11px;
  margin-right:12px; flex-shrink:0;
}
.phx-nav a{
  color:#9a9aa4; text-decoration:none; font-size:11px; letter-spacing:.06em;
  text-transform:uppercase; padding:8px 12px; border-radius:0 0 6px 6px;
  transition:color .15s ease, background .15s ease; flex-shrink:0;
}
.phx-nav a:hover{ color:#e8e6e1; background:rgba(255,255,255,.06); }
.phx-nav a.current{ color:#0a0a0d; background:#f2a93b; font-weight:700; }
@media (max-width:820px){ .sidebar{width:150px;} .navbtn{font-size:11px;padding:9px 12px;} }
</style>
</head>
<body>
<nav class="phx-nav"><span class="phx-nav-tag">PHX</span><a href="events-calendar.html">Events Calendar</a><a href="f2p-task-guide.html">F2P Task Guide</a><a href="crewing.html" class="current">Crewing</a><a href="index.html">Tracker</a></nav>

<div id="app"><div class="loading">Loading crew library…</div></div>
<div class="lightbox" id="lightbox"><img id="lightboxImg" src=""></div>

<script>
const SUPABASE_URL = 'https://mmzizgsanwqjpiumpqay.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1teml6Z3NhbndxanBpdW1wcWF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjk5MzksImV4cCI6MjEwMTYwNTkzOX0.KqvY2Ib33J8h8ztEi8qxtfutSdVIPAaJRtj7cSUSKFM';

let crews = [];
let hostileTypes = [];
let selectedType = null;
let dbStatus = 'connecting';
let dbError = '';

const app = document.getElementById('app');

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function sb(path){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}` }
  });
  if(!res.ok){
    let msg=''; try{ const j=await res.json(); msg=j.message||JSON.stringify(j); }catch(e){ msg=res.statusText; }
    throw new Error(`${res.status}: ${msg}`);
  }
  return res.json();
}

async function loadAll(){
  dbStatus='connecting';
  try{
    const rows = await sb('crews?select=*&order=sort_order.asc');
    crews = rows || [];
    const set = new Set();
    crews.forEach(c => (c.hostile_types||[]).forEach(t => set.add(t)));
    hostileTypes = Array.from(set).sort();
    if(!selectedType || !hostileTypes.includes(selectedType)) selectedType = hostileTypes[0] || null;
    dbStatus='connected';
  }catch(e){
    console.error(e);
    dbStatus='error'; dbError=e.message;
  }
  render();
}

function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('show');
}
document.getElementById('lightbox').addEventListener('click', ()=>{
  document.getElementById('lightbox').classList.remove('show');
});

function render(){
  app.innerHTML = `
    <div class="topbar">
      <div class="elbow"><span>PHX</span></div>
      <div class="topbar-bar">
        <div>
          <div class="topbar-title"><b>PHOENIX</b> EU168 CREWING</div>
          <div class="topbar-sub">Suggested crews by hostile type — keeps growing as new tests come in</div>
        </div>
      </div>
    </div>
    <div class="body-row">
      <div class="sidebar">
        <div class="sidebar-label">Hostile Type</div>
        <div id="typeList"></div>
        <div class="sidebar-foot">Have a crew that works? Drop it in Discord and it'll get added here.</div>
      </div>
      <main id="main"></main>
    </div>
  `;
  const main = document.getElementById('main');
  if(dbStatus==='error'){
    main.innerHTML = `<div class="errbox"><b>Could not reach the database.</b>\n${escapeHtml(dbError)}</div>`;
    return;
  }
  if(dbStatus==='connecting'){
    main.innerHTML = `<div class="loading">Loading crew library…</div>`;
    return;
  }

  const typeList = document.getElementById('typeList');
  if(hostileTypes.length===0){
    typeList.innerHTML = `<div class="empty" style="padding:10px 20px;">No crews added yet.</div>`;
  } else {
    typeList.innerHTML = hostileTypes.map(t=>
      `<button class="navbtn ${t===selectedType?'active':''}" data-type="${escapeHtml(t)}">${escapeHtml(t)}</button>`
    ).join('');
    typeList.querySelectorAll('[data-type]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ selectedType = btn.dataset.type; render(); });
    });
  }

  main.innerHTML = `
    <div class="section-head"><h1>${selectedType ? escapeHtml(selectedType) : 'Crews'} <span class="accent">Crews</span></h1></div>
    <div class="section-desc">Suggested officer/tech loadouts for this hostile type. Tap an image to zoom in.</div>
    <div id="crewCards"></div>
  `;
  const cardsWrap = document.getElementById('crewCards');
  const matching = selectedType ? crews.filter(c => (c.hostile_types||[]).includes(selectedType)) : crews;
  if(matching.length===0){
    cardsWrap.innerHTML = `<div class="empty">No crews for this hostile type yet.</div>`;
    return;
  }
  cardsWrap.innerHTML = matching.map(c => `
    <div class="crew-card">
      <img src="${escapeHtml(c.image_url)}" alt="${escapeHtml(c.title)}" loading="lazy" data-src="${escapeHtml(c.image_url)}">
      <div class="crew-card-meta">
        <div>
          <div class="crew-card-title">${escapeHtml(c.title)}</div>
          <div class="crew-card-sub">${c.author ? 'By '+escapeHtml(c.author) : ''}${c.date_added ? ' · '+escapeHtml(c.date_added) : ''}${c.source_sheet ? ' · '+escapeHtml(c.source_sheet) : ''}</div>
        </div>
      </div>
      ${(c.hostile_types||[]).length>1 ? `<div class="crew-card-tags">${(c.hostile_types||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      ${c.notes ? `<div class="crew-card-tags"><span class="crew-card-sub">${escapeHtml(c.notes)}</span></div>` : ''}
    </div>
  `).join('');
  cardsWrap.querySelectorAll('img[data-src]').forEach(img=>{
    img.addEventListener('click', ()=> openLightbox(img.dataset.src));
  });
}

loadAll();
</script>
</body>
</html>
