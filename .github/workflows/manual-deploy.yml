name: Manual Deploy (wrangler)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy via wrangler
        continue-on-error: true
        run: npx wrangler deploy > deploy-output.txt 2>&1 || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Commit output
        if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git add deploy-output.txt
          git commit -m "diag: manual deploy output" || echo "nothing to commit"
          git push
