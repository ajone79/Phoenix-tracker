name: Scrape stfc.club Crews

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scripts/stfc_club_scraper.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add club-crews.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update stfc.club crew library ($(date -u +'%Y-%m-%d'))"
            git pull --rebase
            git push
          fi
