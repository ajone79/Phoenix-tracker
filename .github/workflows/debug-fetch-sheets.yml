name: Debug Fetch Sheets Data

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch catalog + a sample sheet, write results to a debug file
        run: |
          mkdir -p debug
          echo "===== CATALOG CSV FETCH ====="  > debug/sheets-debug.txt
          HTTP_STATUS=$(curl -sL -o /tmp/catalog.csv -w "%{http_code}" "https://docs.google.com/spreadsheets/d/1AHbQfUYpL3_DpRV-J0m2PbPVYCuzZe3P5t763xaJ5uA/export?format=csv")
          echo "HTTP status: $HTTP_STATUS" >> debug/sheets-debug.txt
          echo "Byte count: $(wc -c < /tmp/catalog.csv)" >> debug/sheets-debug.txt
          echo "----- first 2000 chars of response -----" >> debug/sheets-debug.txt
          head -c 2000 /tmp/catalog.csv >> debug/sheets-debug.txt
          echo "" >> debug/sheets-debug.txt
          echo "===== END CATALOG CSV FETCH =====" >> debug/sheets-debug.txt
          cp /tmp/catalog.csv debug/sheets-debug.txt.catalog 2>/dev/null || true

          python3 > /tmp/sheet_url.txt << 'PYEOF'
          import csv
          with open('/tmp/catalog.csv') as f:
              content = f.read()
          reader = csv.DictReader(content.splitlines())
          for row in reader:
              if row.get('Sheet URL'):
                  print(row['Sheet URL'])
                  break
          PYEOF
          SHEET_URL=$(cat /tmp/sheet_url.txt)

          echo "" >> debug/sheets-debug.txt
          echo "===== FIRST SHEET URL: $SHEET_URL =====" >> debug/sheets-debug.txt
          if [ -n "$SHEET_URL" ]; then
            SHEET_ID=$(echo "$SHEET_URL" | grep -oP '(?<=/d/e/)[a-zA-Z0-9_-]+')
            GID=$(echo "$SHEET_URL" | grep -oP '(?<=gid=)[0-9]+' || echo "")
            EXPORT_URL="https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?output=csv"
            if [ -n "$GID" ]; then EXPORT_URL="${EXPORT_URL}&gid=${GID}&single=true"; fi
            echo "===== FETCHING (published format): $EXPORT_URL =====" >> debug/sheets-debug.txt
            PUB_STATUS=$(curl -sL -o /tmp/pub.csv -w "%{http_code}" "$EXPORT_URL")
            echo "Published-format HTTP status: $PUB_STATUS, bytes: $(wc -c < /tmp/pub.csv)" >> debug/sheets-debug.txt
            head -c 1500 /tmp/pub.csv >> debug/sheets-debug.txt
            echo "" >> debug/sheets-debug.txt
            echo "===== END PUBLISHED FORMAT ====="  >> debug/sheets-debug.txt
          fi

          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add debug/sheets-debug.txt
          git commit -m "Debug: sheets catalog + sample sheet fetch output" || echo "nothing to commit"
          git push
