name: Diagnose Live Edge Content

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare deployment state
        run: |
          OUT=diag-output.txt
          echo "Diagnostic run at $(date -u)" > "$OUT"
          echo "" >> "$OUT"
          echo "=== Cloudflare Workers scripts on this account ===" >> "$OUT"
          curl -s "https://api.cloudflare.com/client/v4/accounts/9d1202cc74e137008e0feafebb8a8d06/workers/scripts" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            | python3 -c "
import json,sys
d=json.load(sys.stdin)
if not d.get('success'):
    print('API call failed:', d.get('errors'))
else:
    for s in d.get('result', []):
        print(s.get('id'), '| modified_on:', s.get('modified_on'), '| created_on:', s.get('created_on'))
" >> "$OUT"

      - name: Commit results
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git add diag-output.txt
          git commit -m "diag: cloudflare deployment check $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          git push
