name: Diagnose Live Edge Content

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check live content
        run: |
          OUT=diag-output.txt
          echo "Diagnostic run at $(date -u)" > "$OUT"
          NAV=$(curl -sL "https://stfc.phoenixeu168.space/assets/phx-nav-rail.js?bust=$(date +%s)")
          echo "" >> "$OUT"
          echo "nav-rail bytes: ${#NAV}" >> "$OUT"
          echo "G7 Guide in nav-rail: $(printf '%s' "$NAV" | grep -c 'G7 Guide' || true)" >> "$OUT"
          echo "AJ fucked something in nav-rail: $(printf '%s' "$NAV" | grep -c 'AJ fucked something' || true)" >> "$OUT"
          IDX=$(curl -sL "https://stfc.phoenixeu168.space/index.html?bust=$(date +%s)")
          echo "FC Loadout in index: $(printf '%s' "$IDX" | grep -c 'FC Loadout' || true)" >> "$OUT"
      - name: Commit
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git add diag-output.txt
          git commit -m "diag: final verification" || echo "nothing to commit"
          git push
