name: Roster Sync (stfc.pro -> Supabase)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true = report only, no writes to Supabase)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  # Runs automatically every 6 hours, and can also be triggered manually
  # from the Actions tab (with an explicit dry-run choice) for testing.
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests unidecode

      - name: Run roster sync
        env:
          SUPABASE_URL: https://mmzizgsanwqjpiumpqay.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Scheduled runs (cron) always go live. Manual runs (workflow_dispatch)
          # respect the dry_run choice - defaulting to dry-run for safety if
          # that input is ever missing for some reason.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" != "false" ]; then
            python scripts/sync_roster.py --dry-run
          else
            python scripts/sync_roster.py
          fi
