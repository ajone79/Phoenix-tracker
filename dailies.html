<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Phoenix EU168 — Daily Checklist</title>
<script src="assets/phx-nav-rail.js"></script>
<script src="assets/phx-polish.js"></script>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-eu168.png">
<link rel="apple-touch-icon" href="/icon-eu168.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ── Design tokens: dark space, matches Phoenix EU168 ───────────────────── */
:root {
  --bg:        #0a0d16;
  --panel:     #121729;
  --panel2:    #171d33;
  --line:      #262e4a;
  --amber:     #f2a93b;
  --amber-bg:  rgba(242,169,59,.10);
  --amber-mid: rgba(242,169,59,.30);
  --teal:      #4fd1c5;
  --teal-bg:   rgba(79,209,197,.10);
  --text:      #e7ecf3;
  --sub:       #8b93a7;
  --green:     #6ee7b7;
  --red:       #f87171;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Rajdhani', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-left:   max(16px, env(safe-area-inset-left,  0px));
  padding-right:  max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 80px;
}

/* ── Header ─────────────────────────────────────────────────────────────── */
header {
  padding: 22px 0 18px;
  border-bottom: 1px solid var(--line);
}
.eyebrow {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px; letter-spacing: .15em; text-transform: uppercase;
  color: var(--teal); margin-bottom: 7px;
}
h1 {
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  font-size: clamp(22px, 5vw, 30px);
  letter-spacing: .02em; line-height: 1.1;
  color: #fff; margin-bottom: 16px;
}
h1 em { color: var(--amber); font-style: normal; }

/* ── Reset bar ───────────────────────────────────────────────────────────── */
.reset-bar {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 14px; margin-bottom: 12px;
}
.rl { font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--sub); }
.countdown {
  font-family: 'Share Tech Mono', monospace;
  font-size: 24px; font-weight: 700; color: var(--amber);
  letter-spacing: .08em; font-variant-numeric: tabular-nums; line-height: 1;
}
.today-str {
  margin-left: auto;
  font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--sub);
}

/* ── Progress ────────────────────────────────────────────────────────────── */
.prog-row { display: flex; align-items: center; gap: 10px; }
.prog-track { flex: 1; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.prog-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--teal), var(--amber));
  transition: width .4s ease;
}
.prog-txt {
  font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--text);
  white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 52px; text-align: right;
}

/* ── Main layout ─────────────────────────────────────────────────────────── */
main { padding-top: 18px; max-width: 680px; }

/* ── Section ─────────────────────────────────────────────────────────────── */
.sec { margin-bottom: 14px; }
.sec-head {
  display: flex; align-items: center; gap: 10px;
  background: var(--panel2); border: 1px solid var(--line); border-radius: 8px 8px 0 0;
  padding: 9px 14px; cursor: pointer; user-select: none;
  transition: background .1s;
}
.sec-head:hover { background: rgba(255,255,255,.045); }
.sec-head.closed { border-radius: 8px; }
.sec-icon { font-size: 15px; flex-shrink: 0; }
.sec-title {
  font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: .11em; text-transform: uppercase; flex: 1; color: var(--text);
}
.sec-cnt {
  font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--sub);
  font-variant-numeric: tabular-nums;
}
.sec-arrow { font-size: 9px; color: var(--sub); flex-shrink: 0; transition: transform .18s; }
.sec-head.closed .sec-arrow { transform: rotate(-90deg); }
.sec-body {
  background: var(--panel); border: 1px solid var(--line); border-top: none;
  border-radius: 0 0 8px 8px; overflow: hidden;
}

/* ── Task ────────────────────────────────────────────────────────────────── */
.task {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; border-bottom: 1px solid var(--line);
  cursor: pointer; transition: background .1s;
}
.task:last-child { border-bottom: none; }
.task:hover { background: rgba(255,255,255,.025); }
.task.done { opacity: .5; }

.cb-box {
  width: 20px; height: 20px; flex-shrink: 0;
  border: 2px solid var(--line); border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 900; color: transparent;
  transition: all .12s; background: transparent;
}
.task.done .cb-box { background: var(--teal); border-color: var(--teal); color: #0a0d16; }

.task-info { flex: 1; min-width: 0; }
.task-name {
  font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.3; word-break: break-word;
}
.task.done .task-name { color: var(--sub); text-decoration: line-through; }
.task-note { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--sub); margin-top: 2px; }

.del-btn {
  flex-shrink: 0; color: var(--sub); font-size: 13px; padding: 4px 6px;
  opacity: 0; cursor: pointer; background: none; border: none;
  transition: all .12s; line-height: 1;
}
.task:hover .del-btn { opacity: 1; }
.del-btn:hover { color: var(--red); }

/* Week pill */
.wpill {
  display: inline-flex; align-items: center;
  padding: 1px 7px; border-radius: 10px;
  font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
  margin-left: 7px; vertical-align: middle; border: 1px solid;
}
.wpill.today { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-mid); }
.wpill.other { background: rgba(255,255,255,.04); color: var(--sub); border-color: var(--line); }

/* ── Add custom task ──────────────────────────────────────────────────────── */
.add-wrap {
  display: flex; gap: 8px; align-items: center;
  padding: 10px 14px; border-top: 1px solid var(--line);
}
.add-input {
  flex: 1; min-width: 0;
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  color: var(--text); font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 600;
  padding: 7px 10px; outline: none; transition: border-color .15s;
}
.add-input:focus { border-color: var(--teal); }
.add-input::placeholder { color: var(--sub); font-weight: 400; }
.add-btn {
  background: var(--teal); color: #0a0d16; border: none; border-radius: 6px;
  font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: .08em;
  padding: 8px 14px; cursor: pointer; font-weight: 700; white-space: nowrap;
  transition: opacity .15s; flex-shrink: 0;
}
.add-btn:hover { opacity: .82; }

/* ── Footer ───────────────────────────────────────────────────────────────── */
.footer-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.btn-ghost {
  background: transparent; border: 1px solid var(--line); border-radius: 6px;
  color: var(--sub); font-family: 'Share Tech Mono', monospace; font-size: 11px;
  letter-spacing: .07em; padding: 7px 14px; cursor: pointer;
  transition: all .15s;
}
.btn-ghost:hover { border-color: var(--amber); color: var(--amber); }
.btn-ghost[data-confirming]:hover { border-color: var(--red); color: var(--red); }
.footer-note {
  font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--sub);
  margin-top: 14px; line-height: 1.65;
}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Phoenix EU168</div>
  <h1>Daily <em>Checklist</em></h1>
  <div class="reset-bar">
    <div>
      <div class="rl">Server reset in</div>
      <div class="countdown" id="countdown">--:--:--</div>
    </div>
    <div class="today-str" id="today-str"></div>
  </div>
  <div class="prog-row">
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <span class="prog-txt" id="prog-txt">0 / 0</span>
  </div>
</header>

<main id="main"></main>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════════════════════
const DAILY_SECS = [
  { id:'missions', icon:'📋', title:'Daily Missions', tasks:[
    {id:'m1', name:'Complete Daily Mission 1'},
    {id:'m2', name:'Complete Daily Mission 2'},
    {id:'m3', name:'Complete Daily Mission 3'},
  ]},
  { id:'combat', icon:'⚔️', title:'Combat', tasks:[
    {id:'c1', name:'Kill hostiles — daily target',       note:'Check arc for hostile type (Klingon, Rogue, armada, etc.)'},
    {id:'c2', name:'Complete 1+ armada'},
    {id:'c3', name:'PvP — attack 1+ player',            note:'Required for some arc score tasks'},
  ]},
  { id:'alliance', icon:'🤝', title:'Alliance', tasks:[
    {id:'a1', name:'Help 5× alliance members'},
    {id:'a2', name:'Donate to alliance tech'},
    {id:'a3', name:'Alliance Store purchase'},
  ]},
  { id:'stores', icon:'🏪', title:'Faction Stores', tasks:[
    {id:'s1', name:'Federation Store daily refresh',  note:'Credits, starship parts, officer shards'},
    {id:'s2', name:'Klingon Store daily refresh'},
    {id:'s3', name:'Romulan Store daily refresh'},
    {id:'s4', name:'Eclipse Store — officer shards',  note:'If shards are available'},
    {id:'s5', name:'Other faction stores',            note:'Rogue / AX / Picard / Dominion if applicable to grade'},
  ]},
  { id:'economy', icon:'⚡', title:'Economy', tasks:[
    {id:'e1', name:'Refinery — raw material run',       note:'Gas / Crystal / Ore → refined'},
    {id:'e2', name:'Refinery — refined material run',   note:'Refined → uncommon / rare (G5+)'},
    {id:'e3', name:'Collect completed mining nodes'},
    {id:'e4', name:'Send ships to mine for arc tasks'},
  ]},
  { id:'progression', icon:'🔬', title:'Progression', tasks:[
    {id:'p1', name:'Research — start or complete'},
    {id:'p2', name:'Build / upgrade — start or complete'},
    {id:'p3', name:'Officer XP and shard levelling'},
  ]},
  { id:'events', icon:'🎯', title:'Arc & Events', tasks:[
    {id:'ev1', name:'Arc event tasks',           note:'Check which event type is running today'},
    {id:'ev2', name:'Claim event milestones'},
    {id:'ev3', name:'AT tasks (if tournament)',  note:'See AT Task Guide for today\'s ops'},
    {id:'ev4', name:'ALB score (if ALB live)',   note:'Alliance Leaderboard event day'},
  ]},
  { id:'misc', icon:'🎁', title:'Free & Misc', tasks:[
    {id:'misc1', name:'Claim free daily chest'},
    {id:'misc2', name:'Free recruitment pulls',       note:'Check store for any free pulls'},
    {id:'misc3', name:'Check promo codes',            note:'Alliance Discord / Reddit for new codes'},
    {id:'misc4', name:'Exchange items',               note:'If exchange event is active'},
  ]},
];

const WEEKLY_TASKS = [
  {id:'w_tt',    name:'Territory Takeover',           days:[0],       note:'Coordinate start time with alliance'},
  {id:'w_tour',  name:'Alliance Tournament battles',  days:[4,5,6,0,1], note:'Thu–Mon when tournament is active'},
  {id:'w_incur', name:'Incursion tasks',              days:[0,1,2,3,4,5,6], note:'When incursion window is live'},
  {id:'w_xalb',  name:'Cross-ALB / Heroic XALB',     days:[0,1,2,3,4,5,6], note:'When XALB event is active'},
  {id:'w_pvp',   name:'Weekly PvP ranking push',      days:[1],       note:'Monday leaderboard resets — push score'},
];

// ═══════════════════════════════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════════════════════════════
function pad2(n) { return String(n).padStart(2,'0'); }
function utcDate() {
  const d = new Date();
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`;
}
function utcWeek() {
  const d = new Date();
  const dow = d.getUTCDay() || 7;
  const mon = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - dow + 1));
  return `${mon.getUTCFullYear()}-${pad2(mon.getUTCMonth()+1)}-${pad2(mon.getUTCDate())}`;
}
const K_DAILY  = () => `phx-daily-${utcDate()}`;
const K_WEEKLY = () => `phx-weekly-${utcWeek()}`;
const K_CUSTOM = 'phx-custom-tasks';
const K_OPEN   = 'phx-open-secs';

function ls_get(k, def) { try { const v=localStorage.getItem(k); return v?JSON.parse(v):def; } catch { return def; } }
function ls_set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

let dailyDone  = new Set(ls_get(K_DAILY(),  []));
let weeklyDone = new Set(ls_get(K_WEEKLY(), []));
let custom     = ls_get(K_CUSTOM, []);
let openSecs   = new Set(ls_get(K_OPEN, [...DAILY_SECS.map(s=>s.id), 'weekly', 'custom']));

// ═══════════════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════════════
function esc(s) {
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function mkTaskEl(id, nameHTML, noteText, checked, onToggle, onDelete) {
  const el = document.createElement('div');
  el.className = 'task' + (checked ? ' done' : '');
  el.dataset.id = id;

  const cb = document.createElement('div');
  cb.className = 'cb-box';
  cb.textContent = checked ? '✓' : '';

  const info = document.createElement('div');
  info.className = 'task-info';
  info.innerHTML = `<div class="task-name">${nameHTML}</div>` +
    (noteText ? `<div class="task-note">${esc(noteText)}</div>` : '');

  el.appendChild(cb);
  el.appendChild(info);

  if (onDelete) {
    const del = document.createElement('button');
    del.className = 'del-btn';
    del.title = 'Remove task';
    del.textContent = '✕';
    del.addEventListener('click', e => { e.stopPropagation(); onDelete(id); });
    el.appendChild(del);
  }

  el.addEventListener('click', () => {
    const nowChecked = !el.classList.contains('done');
    el.classList.toggle('done', nowChecked);
    cb.textContent = nowChecked ? '✓' : '';
    onToggle(id, nowChecked);
  });

  return el;
}

function mkSection(id, icon, title, populateFn) {
  const isOpen = openSecs.has(id);
  const wrap = document.createElement('div');
  wrap.className = 'sec';
  wrap.dataset.secId = id;

  const head = document.createElement('div');
  head.className = 'sec-head' + (isOpen ? '' : ' closed');
  head.innerHTML = `
    <span class="sec-icon">${icon}</span>
    <span class="sec-title">${title}</span>
    <span class="sec-cnt" data-cnt="${id}"></span>
    <span class="sec-arrow">▼</span>
  `;

  const body = document.createElement('div');
  body.className = 'sec-body';
  body.style.display = isOpen ? '' : 'none';
  populateFn(body);

  head.addEventListener('click', () => {
    const nowOpen = body.style.display !== 'none';
    body.style.display = nowOpen ? 'none' : '';
    head.classList.toggle('closed', nowOpen);
    if (nowOpen) openSecs.delete(id); else openSecs.add(id);
    ls_set(K_OPEN, [...openSecs]);
  });

  wrap.appendChild(head);
  wrap.appendChild(body);
  return wrap;
}

// ═══════════════════════════════════════════════════════════════════════════
// BUILD PAGE
// ═══════════════════════════════════════════════════════════════════════════
function buildPage() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  // Daily sections
  DAILY_SECS.forEach(sec => {
    main.appendChild(mkSection(sec.id, sec.icon, sec.title, body => {
      sec.tasks.forEach(t => {
        body.appendChild(mkTaskEl(
          t.id, esc(t.name), t.note || '',
          dailyDone.has(t.id),
          (id, checked) => {
            if (checked) dailyDone.add(id); else dailyDone.delete(id);
            ls_set(K_DAILY(), [...dailyDone]);
            updateProgress();
            refreshCnt(sec.id);
          },
          null
        ));
      });
    }));
  });

  // Weekly section
  main.appendChild(mkSection('weekly', '📅', 'Weekly Events', body => {
    const dow = new Date().getUTCDay();
    const DN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    WEEKLY_TASKS.forEach(t => {
      const isToday = t.days.includes(dow);
      const nameHTML = esc(t.name) +
        `<span class="wpill ${isToday?'today':'other'}">${isToday ? 'TODAY' : t.days.map(d=>DN[d]).join('/')}</span>`;
      body.appendChild(mkTaskEl(
        t.id, nameHTML, t.note || '',
        weeklyDone.has(t.id),
        (id, checked) => {
          if (checked) weeklyDone.add(id); else weeklyDone.delete(id);
          ls_set(K_WEEKLY(), [...weeklyDone]);
          refreshCnt('weekly');
        },
        null
      ));
    });
  }));

  // Custom section
  main.appendChild(mkSection('custom', '✏️', 'My Custom Tasks', body => {
    custom.forEach(t => {
      body.appendChild(mkTaskEl(
        t.id, esc(t.name), '',
        dailyDone.has(t.id),
        (id, checked) => {
          if (checked) dailyDone.add(id); else dailyDone.delete(id);
          ls_set(K_DAILY(), [...dailyDone]);
          updateProgress();
          refreshCnt('custom');
        },
        (id) => {
          custom = custom.filter(c => c.id !== id);
          ls_set(K_CUSTOM, custom);
          buildPage();
        }
      ));
    });
    // Add task row
    const addRow = document.createElement('div');
    addRow.className = 'add-wrap';
    addRow.innerHTML = `
      <input class="add-input" id="add-input" type="text" placeholder="Add a custom task…" maxlength="80">
      <button class="add-btn">+ Add</button>
    `;
    addRow.querySelector('.add-btn').addEventListener('click', doAdd);
    addRow.querySelector('#add-input').addEventListener('keydown', e => { if (e.key==='Enter') doAdd(); });
    body.appendChild(addRow);
  }));

  // Footer buttons
  const foot = document.createElement('div');
  foot.className = 'footer-row';

  const btnUncheck = document.createElement('button');
  btnUncheck.className = 'btn-ghost';
  btnUncheck.textContent = 'Uncheck all today';
  btnUncheck.addEventListener('click', () => dblConfirm(btnUncheck, () => {
    dailyDone.clear();
    ls_set(K_DAILY(), []);
    buildPage();
  }));

  const btnClear = document.createElement('button');
  btnClear.className = 'btn-ghost';
  btnClear.textContent = 'Clear custom tasks';
  btnClear.addEventListener('click', () => dblConfirm(btnClear, () => {
    custom = [];
    ls_set(K_CUSTOM, []);
    buildPage();
  }));

  foot.appendChild(btnUncheck);
  foot.appendChild(btnClear);
  main.appendChild(foot);

  const note = document.createElement('p');
  note.className = 'footer-note';
  note.textContent = 'Daily tasks reset at 00:00 UTC (server reset). Weekly tasks reset each Monday UTC. Custom tasks persist until removed. Checks are stored only in this browser.';
  main.appendChild(note);

  refreshAllCnts();
  updateProgress();
}

function doAdd() {
  const input = document.getElementById('add-input');
  if (!input) return;
  const name = input.value.trim();
  if (!name) return;
  custom.push({ id: 'cx-' + Date.now(), name });
  ls_set(K_CUSTOM, custom);
  input.value = '';
  buildPage();
}

function dblConfirm(btn, action) {
  if (btn.dataset.confirming) {
    action();
    delete btn.dataset.confirming;
    btn.textContent = btn.dataset.orig;
    return;
  }
  btn.dataset.confirming = '1';
  btn.dataset.orig = btn.textContent;
  btn.textContent = 'Tap again to confirm';
  setTimeout(() => {
    if (btn.dataset.confirming) {
      delete btn.dataset.confirming;
      btn.textContent = btn.dataset.orig;
    }
  }, 3000);
}

// ═══════════════════════════════════════════════════════════════════════════
// PROGRESS & SECTION COUNTS
// ═══════════════════════════════════════════════════════════════════════════
function updateProgress() {
  let total = 0, done = 0;
  DAILY_SECS.forEach(s => s.tasks.forEach(t => {
    total++;
    if (dailyDone.has(t.id)) done++;
  }));
  custom.forEach(t => {
    total++;
    if (dailyDone.has(t.id)) done++;
  });
  const pct = total ? (done / total * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-txt').textContent  = `${done} / ${total}`;
}

function refreshCnt(secId) {
  const el = document.querySelector(`[data-cnt="${secId}"]`);
  if (!el) return;
  if (secId === 'weekly') {
    const d = WEEKLY_TASKS.filter(t => weeklyDone.has(t.id)).length;
    el.textContent = `${d}/${WEEKLY_TASKS.length}`;
  } else if (secId === 'custom') {
    const d = custom.filter(t => dailyDone.has(t.id)).length;
    el.textContent = `${d}/${custom.length}`;
  } else {
    const sec = DAILY_SECS.find(s => s.id === secId);
    if (!sec) return;
    const d = sec.tasks.filter(t => dailyDone.has(t.id)).length;
    el.textContent = `${d}/${sec.tasks.length}`;
  }
}
function refreshAllCnts() {
  DAILY_SECS.forEach(s => refreshCnt(s.id));
  refreshCnt('weekly');
  refreshCnt('custom');
}

// ═══════════════════════════════════════════════════════════════════════════
// COUNTDOWN & AUTO-RESET
// ═══════════════════════════════════════════════════════════════════════════
let _prevDay  = utcDate();
let _prevWeek = utcWeek();

function tick() {
  const now  = new Date();
  const next = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1));
  const ms   = next - now;
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);

  document.getElementById('countdown').textContent = `${pad2(h)}:${pad2(m)}:${pad2(s)}`;

  const DN  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MN  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('today-str').textContent =
    `${DN[now.getUTCDay()]} ${now.getUTCDate()} ${MN[now.getUTCMonth()]} — UTC`;

  // Auto-reset on UTC day change
  const today = utcDate();
  if (today !== _prevDay) {
    _prevDay  = today;
    dailyDone = new Set();
    ls_set(K_DAILY(), []);
    buildPage();
  }

  // Auto-reset on UTC week change (Monday)
  const week = utcWeek();
  if (week !== _prevWeek) {
    _prevWeek  = week;
    weeklyDone = new Set();
    ls_set(K_WEEKLY(), []);
    buildPage();
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════
buildPage();
tick();
setInterval(tick, 1000);
</script>
