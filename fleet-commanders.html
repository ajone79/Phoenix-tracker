<!DOCTYPE html>
<html lang="en">
<head>
<script src="assets/phx-nav-menu.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phoenix EU168 — Fleet Commanders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#050507; --panel:#111116; --panel-2:#17171e; --hair:#2a2a34;
    --signal:#ff9142; --periwinkle:#8fa3ff; --mint:#5fd068; --gold:#ffc857; --alert:#ff5a5f;
    --text:#e8e6e1; --text-dim:#8a8a94; --text-faint:#55555f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--void);color:var(--text);font-family:'Space Mono',monospace;-webkit-font-smoothing:antialiased;}
  #app{display:flex;min-height:100vh;flex-direction:column;}
  .topbar{display:flex;align-items:stretch;height:64px;flex-shrink:0;}
  .elbow{width:120px;background:var(--signal);border-bottom-left-radius:34px;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;}
  .elbow span{font-family:'Antonio',sans-serif;font-weight:700;color:var(--void);font-size:13px;letter-spacing:.08em;}
  .topbar-bar{flex:1;background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:2px solid var(--hair);}
  .topbar-title{font-family:'Antonio',sans-serif;font-weight:700;font-size:22px;letter-spacing:.06em;}
  .topbar-title b{color:var(--signal);}
  .topbar-sub{font-size:11px;color:var(--text-dim);}
  .body-row{display:flex;flex:1;min-height:0;}
  .sidebar{width:240px;flex-shrink:0;background:var(--panel);padding:22px 0;display:flex;flex-direction:column;gap:6px;border-right:2px solid var(--hair);overflow-y:auto;}
  .sidebar-label{margin:0 20px 8px;font-family:'Antonio',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);}
  .sidebar-block{margin-bottom:18px;}
  .navbtn{margin:0 14px;padding:10px 16px;border-radius:0 20px 20px 0;font-family:'Antonio',sans-serif;font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:13px;cursor:pointer;border:none;text-align:left;background:transparent;color:var(--text-dim);transition:all .12s ease;width:calc(100% - 14px);}
  .navbtn:hover{color:var(--text);background:rgba(255,255,255,.05);}
  .navbtn.active{background:var(--signal);color:var(--void);}
  .navbtn .sub{display:block;font-family:'Space Mono',monospace;font-size:10px;font-weight:400;letter-spacing:0;text-transform:none;opacity:.75;margin-top:1px;}
  .owned-list{margin:0 20px;display:flex;flex-direction:column;gap:2px;}
  .owned-row{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:11.5px;color:var(--text-dim);cursor:pointer;user-select:none;}
  .owned-row input{accent-color:var(--signal);cursor:pointer;}
  .owned-row.checked{color:var(--text);}
  .sidebar-foot{margin-top:auto;padding:16px 20px 0;font-size:10px;color:var(--text-faint);line-height:1.6;border-top:1px solid var(--hair);}
  main{flex:1;padding:26px 30px 40px;overflow-y:auto;}
  .section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap;}
  .section-head h1{font-family:'Antonio',sans-serif;font-weight:700;font-size:26px;margin:0;letter-spacing:.03em;}
  .section-head .accent{color:var(--signal);}
  .section-desc{color:var(--text-dim);font-size:12px;max-width:680px;margin-bottom:20px;}
  .empty{color:var(--text-faint);font-size:12px;padding:30px 4px;text-align:center;}
  .loading{padding:40px;text-align:center;color:var(--text-dim);font-size:12px;}
  .errbox{background:#2a1414;border:1px solid var(--alert);color:#ffb3b6;padding:14px 16px;border-radius:8px;font-size:11.5px;margin-bottom:18px;white-space:pre-wrap;word-break:break-word;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--hair);border-radius:4px;}

  .fc-card{background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;}
  .fc-card.top{border-color:var(--signal);background:linear-gradient(90deg, rgba(255,145,66,.10), var(--panel) 60%);}
  .fc-card.owned{border-left:3px solid var(--mint);}
  .fc-rank{font-family:'Antonio',sans-serif;font-weight:700;font-size:20px;color:var(--text-faint);width:26px;flex-shrink:0;text-align:center;}
  .fc-card.top .fc-rank{color:var(--signal);}
  .fc-body{flex:1;min-width:0;}
  .fc-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .fc-name{font-family:'Antonio',sans-serif;font-weight:700;font-size:16px;}
  .fc-badge{font-size:9.5px;background:var(--panel-2);border:1px solid var(--hair);color:var(--text-dim);padding:2px 7px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase;}
  .fc-badge.owned{border-color:var(--mint);color:var(--mint);}
  .fc-badge.hit{border-color:var(--signal);color:var(--signal);}
  .fc-sub{font-size:11px;color:var(--text-dim);margin-top:3px;}
  .fc-summary{font-size:11.5px;color:var(--mint);margin-top:5px;line-height:1.5;max-width:560px;}
  .fc-features{font-size:10.5px;color:var(--text-faint);margin-top:4px;}
  .fc-score{flex-shrink:0;text-align:right;}
  .fc-score-n{font-family:'Antonio',sans-serif;font-weight:700;font-size:18px;color:var(--periwinkle);}
  .fc-score-l{font-size:9px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}

  .cat-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
  .cat-chip{font-size:10.5px;background:var(--panel-2);border:1px solid var(--hair);color:var(--text-dim);padding:5px 11px;border-radius:20px;cursor:pointer;letter-spacing:.02em;transition:all .12s ease;}
  .cat-chip:hover{color:var(--text);border-color:var(--periwinkle);}
  .cat-chip.active{background:var(--periwinkle);border-color:var(--periwinkle);color:var(--void);font-weight:700;}

  .note-banner{display:flex;align-items:flex-start;gap:10px;background:repeating-linear-gradient(135deg, #0d1a2a, #0d1a2a 10px, #0a1622 10px, #0a1622 20px);border:2px solid var(--periwinkle);border-radius:8px;padding:12px 14px;margin-bottom:20px;font-size:11px;color:var(--text-dim);}
  .note-banner b{color:var(--periwinkle);}

  .slots-row{margin:0 20px 4px;display:flex;align-items:center;gap:8px;}
  .slots-row select{background:var(--panel-2);border:1px solid var(--hair);color:var(--text);font-family:'Space Mono',monospace;font-size:12px;padding:5px 8px;border-radius:6px;}
  .slots-note{margin:0 20px 18px;font-size:9.5px;color:var(--text-faint);line-height:1.5;}

  .team-divider{display:flex;align-items:center;gap:10px;margin:22px 0 12px;}
  .team-divider span{font-family:'Antonio',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);white-space:nowrap;}
  .team-divider .line{height:1px;background:var(--hair);flex:1;}
  .onduty-tag{font-size:9.5px;background:var(--gold);color:var(--void);padding:2px 7px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;}

  .skills-toggle{background:none;border:1px solid var(--hair);color:var(--text-dim);font-family:'Space Mono',monospace;font-size:10px;padding:3px 10px;border-radius:20px;cursor:pointer;margin-top:6px;}
  .skills-toggle:hover{color:var(--text);border-color:var(--periwinkle);}
  .skills-panel{margin-top:10px;border-top:1px solid var(--hair);padding-top:10px;display:none;}
  .skills-panel.open{display:block;}
  .skills-tree-label{font-family:'Antonio',sans-serif;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--signal);margin:8px 0 4px;}
  .skill-row{font-size:10.5px;color:var(--text-dim);padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03);display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;}
  .skill-row .sname{color:var(--text);font-weight:700;}
  .skill-type{font-size:9px;padding:1px 6px;border-radius:10px;letter-spacing:.03em;text-transform:uppercase;flex-shrink:0;}
  .skill-type.always{background:rgba(95,208,104,.15);color:var(--mint);}
  .skill-type.dock{background:rgba(143,163,255,.15);color:var(--periwinkle);}
  .skill-type.selectable{background:rgba(255,145,66,.15);color:var(--signal);}
  .skill-type.active{background:rgba(255,200,87,.15);color:var(--gold);}
  .skill-bonus{color:var(--text-faint);font-size:9.5px;}
  .infer-mark{color:var(--text-faint);font-size:9px;}

  .wip-banner{display:flex;align-items:center;gap:16px;background:repeating-linear-gradient(135deg, #2a1a05, #2a1a05 12px, #241505 12px, #241505 24px);border-bottom:4px solid var(--gold);padding:20px 26px;font-size:16px;color:var(--gold);}
  .wip-banner .wip-tag{font-family:'Antonio',sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:22px;flex-shrink:0;color:var(--alert);}
  .wip-banner span.wip-txt{color:var(--text);font-size:15px;font-weight:600;line-height:1.5;}
  #app{text-decoration:line-through; text-decoration-color:var(--alert); text-decoration-thickness:2px;}

/* ===== PHX cross-page nav strip ===== */
.phx-nav{
  position:sticky; top:0; z-index:9999;
  display:flex; align-items:center; gap:4px;
  background:#0a0a0d; border-bottom:2px solid #f2a93b;
  padding:0 14px; height:36px;
  font-family:ui-monospace,'SF Mono','Consolas',monospace;
  overflow-x:auto; white-space:nowrap;
}
.phx-nav .phx-nav-tag{
  color:#f2a93b; font-weight:700; letter-spacing:.12em; font-size:11px;
  margin-right:12px; flex-shrink:0;
}
.phx-nav a{
  color:#9a9aa4; text-decoration:none; font-size:11px; letter-spacing:.06em;
  text-transform:uppercase; padding:8px 12px; border-radius:0 0 6px 6px;
  transition:color .15s ease, background .15s ease; flex-shrink:0;
}
.phx-nav a:hover{ color:#e8e6e1; background:rgba(255,255,255,.06); }
.phx-nav a.current{ color:#0a0a0d; background:#f2a93b; font-weight:700; }
@media (max-width:820px){ .sidebar{width:160px;} .navbtn{font-size:11px;padding:9px 12px;} }
</style>
</head>
<body>
<nav class="phx-nav"><span class="phx-nav-tag">PHX</span><a href="index.html">🏠 Home</a><a href="fleet-commanders.html" class="current">Fleet Commanders</a></nav>
<div class="wip-banner"><span class="wip-tag">⚠ WORK IN PROGRESS</span><span class="wip-txt">Do not use this page for real fleet decisions yet. Rankings are based on a rough community cheat sheet, not a verified simulation — treat everything below as an early, unfinished starting point only.</span></div>

<div id="app"><div class="loading">Loading fleet commander data…</div></div>

<script>
const SUPABASE_URL = 'https://mmzizgsanwqjpiumpqay.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1teml6Z3NhbndxanBpdW1wcWF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjk5MzksImV4cCI6MjEwMTYwNTkzOX0.KqvY2Ib33J8h8ztEi8qxtfutSdVIPAaJRtj7cSUSKFM';
const OWNED_KEY = 'phx_fc_owned_v1';

// Curated activity scenarios mapped onto the underlying rating categories.
// Score = count of matching categories where the FC is marked active.
const SCENARIOS = [
  { id:'solomadas', label:'Solo Armadas', cats:[['PVE','Solomadas']] },
  { id:'armadas', label:'Group Armadas', cats:[['PVE','Armadas']] },
  { id:'research', label:'Research Speed / Cost', cats:[['Upgrade Costs','Research Rss Eff'],['Upgrade Costs','Research Mats Eff']] },
  { id:'building', label:'Building Speed / Cost', cats:[['Upgrade Costs','Building Rss Eff'],['Upgrade Costs','Building Mats Eff']] },
  { id:'shipbuild', label:'Ship Build Cost', cats:[['Upgrade Costs','Ship Rss Eff'],['Upgrade Costs','Ship Mats Effs'],['Upgrade Costs','Ship Parts Eff']] },
  { id:'shiprepair', label:'Ship Repair Cost', cats:[['Upgrade Costs','Ship Repair Eff']] },
  { id:'pvpships', label:'PVP — Attacking / Defending Ships', cats:[['PVP','Ships']] },
  { id:'basedef', label:'Base Defense', cats:[['PVP','Base Defense/Attack']] },
  { id:'apex', label:'Apex Barrier / Shred', cats:[['PVP','Apex Barrier/Shred']] },
  { id:'isodmg', label:'Iso Damage (combat)', cats:[['PVP','Iso Damage'],['PVE','Iso Damage']] },
  { id:'qtrials', label:'Q\'s Trials', cats:[['PVE','Q\'s Trials']] },
  { id:'loot', label:'PVE Loot Rewards', cats:[['PVE','Loot Rewards']] },
  { id:'speed', label:'Impulse / Warp Speed', cats:[['Other','Impulse Speed']] },
  { id:'mining', label:'Mining Rate', cats:[['Other','Mining Rate']] },
  { id:'ft', label:'Faction Team Efficiency', cats:[['Other','FT Efficiency']] },
];

const SLOTS_KEY = 'phx_fc_slots_v1';
let commanders = [];
let ratings = []; // {fc_id, category_group, category, active}
let skills = []; // {fc_id, tree, skill_name, type, type_inferred, effect, bonus_min, bonus_max, cc_unlock, rank_unlock, max_level}
let owned = new Set(JSON.parse(localStorage.getItem(OWNED_KEY) || '[]'));
let selectedScenario = SCENARIOS[0].id;
let fcSlots = parseInt(localStorage.getItem(SLOTS_KEY) || '3', 10);
let expandedFc = new Set();
let dbStatus = 'connecting';
let dbError = '';

const app = document.getElementById('app');

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function sb(path){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}` }
  });
  if(!res.ok){
    let msg=''; try{ const j=await res.json(); msg=j.message||JSON.stringify(j); }catch(e){ msg=res.statusText; }
    throw new Error(`${res.status}: ${msg}`);
  }
  return res.json();
}

async function loadAll(){
  dbStatus='connecting';
  try{
    const [c, r, s] = await Promise.all([
      sb('fc_commanders?select=*&order=sort_order.asc'),
      sb('fc_ratings?select=*'),
      sb('fc_skills?select=*&order=tree.asc')
    ]);
    commanders = c || [];
    ratings = r || [];
    skills = s || [];
    dbStatus='connected';
  }catch(e){
    console.error(e);
    dbStatus='error'; dbError=e.message;
  }
  render();
}

function saveOwned(){
  localStorage.setItem(OWNED_KEY, JSON.stringify(Array.from(owned)));
}
function saveSlots(){
  localStorage.setItem(SLOTS_KEY, String(fcSlots));
}
function typeClass(t){
  if(!t) return 'dock';
  const tl = t.toLowerCase();
  if(tl.includes('always on')) return 'always';
  if(tl.includes('selectable')) return 'selectable';
  if(tl.includes('active ability')) return 'active';
  return 'dock';
}

function scoreForScenario(scenario){
  return commanders.map(fc => {
    let hits = [];
    scenario.cats.forEach(([group, cat]) => {
      const row = ratings.find(r => r.fc_id===fc.id && r.category_group===group && r.category===cat);
      if(row && row.active) hits.push(cat);
    });
    return { fc, hits, score: hits.length, maxScore: scenario.cats.length };
  }).sort((a,b) => {
    if(b.score !== a.score) return b.score - a.score;
    const aOwned = owned.has(a.fc.id), bOwned = owned.has(b.fc.id);
    if(aOwned !== bOwned) return aOwned ? -1 : 1;
    return (a.fc.sort_order||0) - (b.fc.sort_order||0);
  });
}

function render(){
  app.innerHTML = `
    <div class="topbar">
      <div class="elbow"><span>PHX</span></div>
      <div class="topbar-bar">
        <div>
          <div class="topbar-title"><b>PHOENIX</b> EU168 FLEET COMMANDERS</div>
          <div class="topbar-sub">Pick a goal, get the best Fleet Commander for it</div>
        </div>
      </div>
    </div>
    <div class="body-row">
      <div class="sidebar">
        <div class="sidebar-block">
          <div class="sidebar-label">Activity / Goal</div>
          <div id="scenarioList"></div>
        </div>
        <div class="sidebar-block">
          <div class="sidebar-label">My FC Slots</div>
          <div class="slots-row">
            <select id="slotsSelect">
              ${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${n===fcSlots?'selected':''}>${n} slot${n>1?'s':''}</option>`).join('')}
            </select>
          </div>
          <div class="slots-note">Slot count grows with Command Center level — check your dock in-game. Docked FCs' "Always On" skills all apply at once, but only one can be On Duty per fleet at a time.</div>
        </div>
        <div class="sidebar-block">
          <div class="sidebar-label">My Fleet Commanders</div>
          <div class="owned-list" id="ownedList"></div>
        </div>
        <div class="sidebar-foot">Ratings are subjective — a community-curated cheat sheet, not an exact simulation. Doesn't account for "always on" abilities.</div>
      </div>
      <main id="main"></main>
    </div>
  `;
  const main = document.getElementById('main');
  if(dbStatus==='error'){
    main.innerHTML = `<div class="errbox"><b>Could not reach the database.</b>\n${escapeHtml(dbError)}</div>`;
    return;
  }
  if(dbStatus==='connecting'){
    main.innerHTML = `<div class="loading">Loading fleet commander data…</div>`;
    return;
  }

  const scenarioList = document.getElementById('scenarioList');
  scenarioList.innerHTML = SCENARIOS.map(s =>
    `<button class="navbtn ${s.id===selectedScenario?'active':''}" data-scenario="${s.id}">${escapeHtml(s.label)}</button>`
  ).join('');
  scenarioList.querySelectorAll('[data-scenario]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ selectedScenario = btn.dataset.scenario; render(); });
  });

  const ownedList = document.getElementById('ownedList');
  ownedList.innerHTML = commanders.map(fc => `
    <label class="owned-row ${owned.has(fc.id)?'checked':''}">
      <input type="checkbox" data-fc="${fc.id}" ${owned.has(fc.id)?'checked':''}>
      ${escapeHtml(fc.display_name)}
    </label>
  `).join('');
  ownedList.querySelectorAll('input[data-fc]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) owned.add(cb.dataset.fc); else owned.delete(cb.dataset.fc);
      saveOwned(); render();
    });
  });

  const slotsSelect = document.getElementById('slotsSelect');
  slotsSelect.addEventListener('change', ()=>{
    fcSlots = parseInt(slotsSelect.value, 10);
    saveSlots(); render();
  });

  const scenario = SCENARIOS.find(s => s.id===selectedScenario);
  const ranked = scoreForScenario(scenario);
  const anyOwned = owned.size > 0;
  const team = ranked.slice(0, fcSlots);
  const rest = ranked.slice(fcSlots);

  main.innerHTML = `
    <div class="section-head"><h1>${escapeHtml(scenario.label)} <span class="accent">— Best FC</span></h1></div>
    <div class="section-desc">Ranked by how well each Fleet Commander's on-duty skills cover this goal. ${anyOwned ? 'Commanders you own are highlighted and prioritized on ties.' : 'Check off which Fleet Commanders you own in the sidebar to prioritize them.'}</div>
    <div class="team-divider"><span>Recommended team (${fcSlots} slot${fcSlots>1?'s':''})</span><div class="line"></div></div>
    <div id="teamCards"></div>
    ${rest.length ? `<div class="team-divider"><span>Other options</span><div class="line"></div></div><div id="restCards"></div>` : ''}
  `;

  function cardHtml(r, i, isOnDuty){
    const isOwned = owned.has(r.fc.id);
    const fcSkills = skills.filter(s => s.fc_id === r.fc.id);
    const trees = Array.from(new Set(fcSkills.map(s=>s.tree))).sort();
    const isOpen = expandedFc.has(r.fc.id);
    return `
      <div class="fc-card ${isOnDuty?'top':''} ${isOwned?'owned':''}">
        <div class="fc-rank">${i+1}</div>
        <div class="fc-body">
          <div class="fc-name-row">
            <span class="fc-name">${escapeHtml(r.fc.display_name)}</span>
            ${isOnDuty ? '<span class="onduty-tag">Suggested on duty</span>' : ''}
            ${isOwned ? '<span class="fc-badge owned">Owned</span>' : ''}
            ${r.score > 0 ? `<span class="fc-badge hit">${r.hits.length}/${scenario.cats.length} match</span>` : ''}
          </div>
          ${r.fc.summary ? `<div class="fc-summary">${escapeHtml(r.fc.summary)}</div>` : ''}
          ${r.fc.f2p_access ? `<div class="fc-sub">F2P access: ${escapeHtml(r.fc.f2p_access)}</div>` : ''}
          ${(r.fc.key_features||[]).length ? `<div class="fc-features">Known for: ${(r.fc.key_features||[]).map(escapeHtml).join(' · ')}</div>` : ''}
          ${fcSkills.length ? `<button class="skills-toggle" data-toggle="${r.fc.id}">${isOpen?'Hide':'Show'} full skill tree (${fcSkills.length})</button>` : ''}
          <div class="skills-panel ${isOpen?'open':''}" data-panel="${r.fc.id}">
            ${trees.map(tree => `
              <div class="skills-tree-label">${escapeHtml(tree)}</div>
              ${fcSkills.filter(s=>s.tree===tree).map(s => `
                <div class="skill-row">
                  <span class="skill-type ${typeClass(s.type)}">${escapeHtml(s.type||'Dock')}</span>
                  <span class="sname">${escapeHtml(s.skill_name)}</span>
                  ${s.effect ? `— ${escapeHtml(s.effect)}` : ''}
                  ${(s.bonus_min!=null && s.bonus_max!=null) ? `<span class="skill-bonus">(${s.bonus_min}${s.bonus_max!==s.bonus_min?' – '+s.bonus_max:''})</span>` : ''}
                  ${s.type_inferred ? `<span class="infer-mark">[type inferred]</span>` : ''}
                </div>
              `).join('')}
            `).join('')}
          </div>
        </div>
        <div class="fc-score">
          <div class="fc-score-n">${r.score}/${r.maxScore}</div>
          <div class="fc-score-l">match</div>
        </div>
      </div>
    `;
  }

  if(ranked.length===0){
    main.querySelector('#teamCards').innerHTML = `<div class="empty">No data yet.</div>`;
    return;
  }

  const teamWrap = document.getElementById('teamCards');
  teamWrap.innerHTML = team.map((r,i) => cardHtml(r, i, i===0 && r.score>0)).join('');

  const restWrap = document.getElementById('restCards');
  if(restWrap){
    restWrap.innerHTML = rest.map((r,i) => cardHtml(r, i+team.length, false)).join('');
  }

  document.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.toggle;
      if(expandedFc.has(id)) expandedFc.delete(id); else expandedFc.add(id);
      render();
    });
  });
}

loadAll();
</script>
</body>
</html>
